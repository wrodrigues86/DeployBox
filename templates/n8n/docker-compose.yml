services:

  n8n:
    image: n8nio/n8n:latest
    container_name: deploybox-${PROJECT_SLUG:-app}

    restart: unless-stopped

    ports:
      - "${DOCKER_HOST_PORT:-5678}:${DOCKER_CONTAINER_PORT:-5678}"

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=${DOCKER_CONTAINER_PORT:-5678}
      - N8N_PROTOCOL=http
      - NODE_ENV=production

    volumes:
      - ./data:/home/node/.n8n
      - ./logs:/logs
