name: Build e Deploy

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar e buildar
      - name: Build
        run: |
          npm install
          npm run build

      # 3. Preparar pasta de produção
      - name: Preparar build final
        run: |
          rm -rf production
          mkdir production

          cp -r server production/
          cp -r client/dist production/client

          cp package.json production/
          cp package-lock.json production/ || true
          cp ecosystem.config.js production/ || true

      # 4. Publicar na branch producao
      - name: Publicar branch producao
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./production
          publish_branch: producao

      # 5. Limpar servidor
      - name: Limpar servidor
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd htdocs/console.wrodrigues.dev.br || exit 1
            rm -rf node_modules server client

      # 6. Enviar arquivos
      - name: Upload
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "production/*"
          target: "htdocs/console.wrodrigues.dev.br"
          strip_components: 1

      # 7. Subir app
      - name: Start
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd htdocs/console.wrodrigues.dev.br || exit 1

            npm install --omit=dev
            npm rebuild better-sqlite3 || true

            pm2 delete nodepanel || true
            pm2 start ecosystem.config.js
            pm2 save
