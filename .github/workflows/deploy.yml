name: Build e Deploy

on:
  push:
    branches:
      - main
      
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar e buildar
      - name: Build
        run: |
          npm install
          npm run build

      # 3. Validar build
      - name: Verificar build
        run: |
          echo "📁 Verificando build..."
          ls -la client
          ls -la client/dist || (echo "❌ dist NÃO foi gerado" && exit 1)

      # 4. Preparar pasta de produção
      - name: Preparar build final
        run: |
          rm -rf production
          mkdir -p production/client

          cp -r server production/
          cp -r client/dist production/client/dist

          cp package.json production/
          cp package-lock.json production/ || true
          cp ecosystem.config.js production/ || true

          echo "📦 Conteúdo do build:"
          ls -la production
          ls -la production/client
          ls -la production/client/dist

      # 5. Publicar na branch producao (SEMPRE LIMPA)
      - name: Publicar branch producao
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./production
          publish_branch: producao
          force_orphan: true

      # 6. Limpar servidor
      - name: Limpar servidor
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd htdocs/console.wrodrigues.dev.br || exit 1

            echo "📁 Pasta atual:"
            pwd
            ls -la

            echo "🧹 Limpando projeto..."
            rm -rf node_modules
            rm -rf server
            rm -rf client
			rm package-lock.json

      # 7. Enviar arquivos
      - name: Upload
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "production/*"
          target: "htdocs/console.wrodrigues.dev.br"
          strip_components: 1

      # 8. Subir aplicação
      - name: Start
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd htdocs/console.wrodrigues.dev.br || exit 1

            echo "📦 Instalando dependências..."
            npm install

            echo "🔧 Rebuild sqlite..."
            npm rebuild better-sqlite3 || true

            echo "🚀 Reiniciando aplicação..."
            pm2 delete nodepanel || true
            pm2 start ecosystem.config.cjs
            pm2 save
			pm2 startup

            echo "✅ Deploy finalizado"
