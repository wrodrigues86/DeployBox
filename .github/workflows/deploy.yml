name: Deploy VPS

on:
  workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar e buildar
      - name: Build
        run: |
          npm install
          npm run build

      # 3. Preparar pacote de deploy
      - name: Preparar arquivos
        run: |
          rm -rf deploy
          mkdir deploy

          cp -r server deploy/
          cp -r client deploy/

          cp package.json deploy/
          cp package-lock.json deploy/ || true
          cp ecosystem.config.js deploy/ || true

          echo "📦 Conteúdo do deploy:"
          ls -la deploy
          ls -la deploy/client

      # 4. Limpar servidor (IMPORTANTE)
      - name: Limpar servidor
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd htdocs/console.wrodrigues.dev.br || exit 1

            echo "📁 Pasta atual:"
            pwd
            ls -la

            echo "🧹 Limpando projeto..."
            rm -rf node_modules
            rm -rf server
            rm -rf client

            echo "📁 Após limpeza:"
            ls -la

      # 5. Enviar arquivos
      - name: Upload via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/*"
          target: "htdocs/console.wrodrigues.dev.br"
          strip_components: 1

      # 6. Instalar e subir app
      - name: Finalizar deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd htdocs/console.wrodrigues.dev.br || exit 1

            echo "📦 Instalando dependências..."
            npm install --omit=dev

            echo "🔧 Rebuild sqlite..."
            npm rebuild better-sqlite3 || true

            echo "🚀 Reiniciando aplicação..."
            pm2 delete nodepanel || true
            pm2 start ecosystem.config.js
            pm2 save

            echo "✅ Deploy finalizado"
