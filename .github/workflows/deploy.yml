name: Deploy VPS

on:
  push:
    branches:
      - main   # se seu repo for master, troca aqui

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Conectar e fazer deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Entrando no projeto..."

            cd /home/dev-console-wrodrigues/htdocs/console.wrodrigues.dev.br

            echo "Atualizando código..."
            git pull origin main

            echo "Instalando dependências..."
            npm install

            echo "Rebuild (caso tenha binários tipo sqlite)..."
            npm rebuild || true

            echo "Reiniciando aplicação..."
            pm2 reload nodepanel || pm2 start ecosystem.config.js
